<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Rock Paper Scissors Game">
    <meta property="og:description" content="Mainkan game batu kertas gunting di sini!">
    <meta property="og:image" content="https://pazu64.github.io/RPS/preview.png">
    <meta property="og:url" content="https://pazu64.github.io/RPS/">
    <meta property="og:type" content="website">
    <title>Rock Papper Scissors</title>
    <link rel="icon" href="image/rps-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="stage">
        <div class="title">
            <h1>Batu Kertas Gunting</h1>
            <h2>Pilih senjatamu, lawan komputer</h2>
        </div>
        <div class="card">
            <div class="score">
                <div class="scoreBox you">
                    <div class="label">Kamu</div>
                    <div class="poin" id="scoreYou">0</div>
                </div>
                <div class="markVs">VS</div>
                <div class="scoreBox cpu">
                    <div class="label">komputer</div>
                    <div class="poin" id="scoreCpu">0</div>
                </div>
            </div>
            <div class="arena">
                <div class="fighter">
                    <div class="fighterIcon" id="youIcon">❔</div>
                    <div class="fighterName">Kamu</div>
                </div>
                <div class="Vs">VS</div>
                <div class="fighter">
                    <div class="fighterIcon" id="cpuIcon">❔</div>
                    <div class="fighterName">Komputer</div>
                </div>
            </div>
            <div class="lastResult idle">
                <div id="resultBanner">Pilih senjata untuk memulai</div>
            </div>
            <div class="choice">
                <button class="choiceBtnRock" onclick="play('rock')">
                    <span class="icon">🪨</span> <span class="choiceName">Batu</span>
                </button>
                <button class="choiceBtnPaper" onclick="play('paper')">
                    <span class="icon">📄</span><span class="choiceName">Kertas</span>
                </button>
                <button class="choiceBtnScissors" onclick="play('scissors')">
                    <span class="icon">✂️</span><span class="choiceName">Gunting</span>
                </button>
            </div>
            <div class="reset">
                <button class="resetBtn" onclick="resetScore()">Reset</button>
            </div>
        </div>
        <div class="note">
            <p>batu kalahkan gunting - gunting kalahkan kertas - kertas kalahkan batu</p>
            <p class="note">Create By Pazu</p>
        </div>
    </div>
</body>
</html>
